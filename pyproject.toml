[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "razormind-api"
version = "0.1.0"
description = "Agentic financial computation and reconciliation platform"
requires-python = ">=3.13,<3.14"

# Phase 0 fixes the CHOICES (docs/12-tech-stack.md) and the VERSIONS.
# Upper bounds are deliberate: a minor bump must be a reviewed change, not a
# silent one, because fixture checksums and Decimal/rounding behaviour are
# load-bearing here.
dependencies = [
    "fastapi>=0.118,<0.121",
    "uvicorn[standard]>=0.38,<0.40",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "sqlalchemy>=2.0.44,<2.1",
    "alembic>=1.17,<2",
    "asyncpg>=0.30,<0.31",
    "httpx>=0.28,<0.29",
    "anthropic>=0.75,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14,<0.15",
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.0,<8",
    "import-linter>=2.4,<3",
]

[tool.setuptools]
package-dir = { "" = "apps/api/src" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["apps/api/src"]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps/api/src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "DTZ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "apps/api/src"
files = ["apps/api/src", "tests", "scripts"]
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m 'not db'"
markers = [
    "slow: tests that shell out to another process",
    "db: integration tests that need a live Postgres (task.py dbtest)",
]

# --------------------------------------------------------------------------
# coverage — Phase 0 exit criterion is 100% BRANCH coverage on the two
# runtime primitives. Nothing else is measured yet, deliberately: a repo-wide
# percentage would let those two slip below 100% unnoticed.
# --------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["runtime"]
omit = [
    # schema.py is a declarative table list. "100% coverage" on it would mean
    # only that the module was imported, which proves nothing. It is verified
    # by `task.py migrate` building it against a real Postgres and by the
    # row-level-security tests querying through it.
    "*/runtime/schema.py",
    # db.py is connection plumbing with no branches worth asserting in
    # isolation. It is exercised end to end by `task.py dbtest`, which is
    # where a broken engine or a missing SET ROLE actually shows up.
    "*/runtime/db.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = ['if TYPE_CHECKING:', '\.\.\.']
