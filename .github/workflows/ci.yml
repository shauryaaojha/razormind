name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, types, boundaries, money guard, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the toolchain image
        # Every dependency is installed inside the container. The runner's own
        # Python is never used, so CI and a developer laptop run byte-identical
        # toolchains.
        run: docker compose build tools

      # Run the gates as separate steps rather than one `check`, so a failure
      # names itself in the job summary instead of hiding inside a script.
      - name: ruff
        run: docker compose run --rm tools scripts/task.py lint

      - name: mypy --strict
        run: docker compose run --rm tools scripts/task.py types

      - name: import-linter (the trust boundary)
        run: docker compose run --rm tools scripts/task.py boundaries

      - name: no float in money paths (C-01)
        run: docker compose run --rm tools scripts/task.py nofloat

      # Before the tests, deliberately. Every test below asserts against this
      # fixture; a drifted fixture makes them wrong and green.
      - name: verify-seed (the fixture assertions)
        run: docker compose run --rm tools scripts/task.py verify-seed

      - name: pytest + 100% branch coverage on runtime/
        run: docker compose run --rm tools scripts/task.py test

  database:
    name: Database — migrations, seed load, row-level security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker compose build api

      - name: Migrate and load the fixture
        run: docker compose run --rm --entrypoint python api scripts/task.py loadseed

      - name: Reconcile the golden window end to end
        run: docker compose run --rm --entrypoint python api scripts/task.py reconcile

      - name: Row-level security, constraints, and the read endpoints
        run: docker compose run --rm --entrypoint python api scripts/task.py dbtest

  web:
    name: Web — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and typecheck
        run: |
          docker run --rm -v "$PWD":/app -w /app/apps/web node:22-slim \
            sh -c "npm ci --no-audit --no-fund && npm run typecheck && npm run build"
